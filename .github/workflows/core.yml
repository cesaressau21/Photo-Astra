name: Core

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core / ${{ matrix.os }} / ${{ matrix.configuration }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04, macos-15]
        configuration: [debug, release]
    env:
      BUILD_CONFIGURATION: ${{ matrix.configuration }}
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Configure, build and test (MSVC)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-core.ps1 -Configuration $env:BUILD_CONFIGURATION
      - name: Configure, build and test (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cmake --preset "core-$BUILD_CONFIGURATION"
          cmake --build --preset "core-$BUILD_CONFIGURATION" --parallel 2
          ctest --preset "core-$BUILD_CONFIGURATION"
